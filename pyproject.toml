[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somnus-debug"
version = "0.1.0"
description = "Somnus Sovereign Systems' project-agnostic Python developer toolkit: production-readiness diagnostics, class/definition structure indexing, pycache cleanup, and a portable single-test harness scaffold."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daeron Rowell / Somnus Sovereign Systems" }]
keywords = ["somnus", "static-analysis", "ast", "linter", "devtools", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Debuggers",
    "Development Status :: 3 - Alpha",
]
# doctor and structure are deliberately stdlib-only (doctor ships its own
# minimal YAML parser for python_doctor.yaml so it has zero deps). The
# pycache cleaner is the one tool that actually imports PyYAML at runtime
# (pycache_cleaner/core.py) for its own config.yaml -- so it's a real
# dependency of this package, not an omission.
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=7"]

# [project.urls] intentionally omitted: no public repository exists yet.
# Add Homepage/Repository/Issues here once one does -- see docs/PUBLISHING.md.

[project.scripts]
somnus-debug = "somnus_debug.cli:main"
somnus-doctor = "somnus_debug.doctor.core:main"
somnus-structure = "somnus_debug.structure.core:main"
somnus-pycache-clean = "somnus_debug.pycache_cleaner.core:main"

# Runtime artifacts that tools in this package generate when *run* (doctor's
# state DB and reports, self-check output, log files) must never ship inside
# the package itself -- they're build-directory pollution from testing, not
# package content. Excluded explicitly here rather than relying on VCS-based
# file selection, since this repo may not always have a clean git history to
# select from.
[tool.hatch.build]
exclude = [
    "**/.python_doctor/",
    "**/*_report.md",
    "**/*_report.json",
    "**/production_doctor.log",
    "**/__pycache__/",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/somnus_debug"]

[tool.hatch.build.targets.sdist]
include = ["src/somnus_debug", "README.md", "LICENSE", "docs/**"]
